<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Редактор персонажа</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2a2a2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Редактор">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a1a;
    color: #fff;
    touch-action: none;
    overscroll-behavior: none;
  }

  button, input, textarea { font-family: inherit; }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px;
    background: #2a2a2a;
    border-bottom: 1px solid #444;
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  #toolbar::-webkit-scrollbar { display: none; }

  .btn {
    background: #3a3a3a;
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    min-height: 44px;
    min-width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn:active { background: #4a4a4a; transform: scale(0.96); }
  .btn.primary { background: #4a7cff; border-color: #4a7cff; }
  .btn.primary:active { background: #3a6cef; }
  .btn.danger { background: #c0392b; border-color: #c0392b; }
  .btn.danger:active { background: #a0291b; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.icon-only { padding: 10px; font-size: 18px; }

  #main {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #111;
    touch-action: none;
  }

  #canvas-wrap.checker::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
      linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    background-color: #1a1a1a;
    pointer-events: none;
  }

  #canvas {
    background: #fff;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    position: absolute;
    will-change: transform, width, height;
    top: 0;
    left: 0;
    transform-origin: 0 0;
  }

  #grid-overlay {
    position: absolute;
    pointer-events: none;
    display: none;
    background-image:
      linear-gradient(to right, rgba(74,124,255,0.3) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(74,124,255,0.3) 1px, transparent 1px);
    background-size: 25% 25%;
    border: 1px solid rgba(74,124,255,0.5);
  }
  #grid-overlay.show { display: block; }

  #center-marker {
    position: absolute;
    width: 20px;
    height: 20px;
    margin: -10px 0 0 -10px;
    pointer-events: none;
    display: none;
    z-index: 6;
  }
  #center-marker.show { display: block; }
  #center-marker::before,
  #center-marker::after {
    content: '';
    position: absolute;
    background: rgba(74,124,255,0.9);
  }
  #center-marker::before {
    left: 50%; top: 0; width: 1px; height: 100%;
    transform: translateX(-0.5px);
  }
  #center-marker::after {
    top: 50%; left: 0; width: 100%; height: 1px;
    transform: translateY(-0.5px);
  }

  #zoom-controls {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }
  #zoom-controls .btn {
    width: 44px;
    height: 44px;
    padding: 0;
    font-size: 20px;
    background: rgba(50,50,50,0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 22px;
  }

  #zoom-info {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.6);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    color: #aaa;
    z-index: 5;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }

  #canvas-tools {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    background: rgba(50,50,50,0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 22px;
    padding: 4px;
    z-index: 5;
  }
  #canvas-tools .btn {
    width: 36px;
    height: 36px;
    padding: 0;
    font-size: 16px;
    background: transparent;
    border: none;
    border-radius: 18px;
    min-height: 36px;
    min-width: 36px;
  }
  #canvas-tools .btn.active { background: #4a7cff; }

  #categories {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px;
    background: #2a2a2a;
    border-top: 1px solid #444;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
    min-height: 60px;
    -webkit-overflow-scrolling: touch;
  }
  #categories::-webkit-scrollbar { display: none; }

  .cat-tab {
    background: #3a3a3a;
    color: #fff;
    border: 1px solid #555;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
    min-height: 40px;
    display: flex;
    align-items: center;
    position: relative;
    gap: 4px;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .cat-tab.active { background: #4a7cff; border-color: #4a7cff; }
  .cat-tab .del-x,
  .cat-tab .visibility-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    line-height: 1;
  }
  .cat-tab .visibility-btn.off { background: rgba(255,255,255,0.15); color: #888; }

  .cat-tab.dragging { opacity: 0.5; transform: scale(1.05); z-index: 10; }
  .cat-tab.drag-over-left::before,
  .cat-tab.drag-over-right::after {
    content: '';
    position: absolute;
    top: 4px; bottom: 4px;
    width: 3px;
    background: #4a7cff;
    border-radius: 2px;
  }
  .cat-tab.drag-over-left::before { left: -5px; }
  .cat-tab.drag-over-right::after { right: -5px; }

  @keyframes tab-wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-1deg); }
    75% { transform: rotate(1deg); }
  }
  .cat-tab.edit-mode { animation: tab-wiggle 0.3s ease-in-out 3; }

  .cat-tab .cat-icon { font-size: 15px; margin-right: 2px; }

  .cat-tab .edit-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
    margin-left: 2px;
    transition: background 0.15s;
  }
  .cat-tab .edit-btn:active { background: rgba(74,124,255,0.6); }
  .cat-tab.active .edit-btn { background: rgba(255,255,255,0.25); }

  .cat-tab .edit-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 20px;
    height: 20px;
    background: #4a7cff;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    border: 2px solid #2a2a2a;
  }
  .cat-tab.edit-mode .edit-badge { display: flex; }

  #items-panel {
    position: absolute;
    bottom: 70px;
    left: 0; right: 0;
    background: #242424;
    border-top: 1px solid #444;
    max-height: 45vh;
    display: none;
    flex-direction: column;
    z-index: 10;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
  }
  #items-panel.open { display: flex; }

  #items-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid #444;
    gap: 8px;
  }
  #items-header span { font-size: 14px; font-weight: 500; }
  #items-header .header-actions { display: flex; gap: 6px; }

  #items-list {
    display: grid;
    grid-template-column
